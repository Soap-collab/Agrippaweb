    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      gap: 0;
    }

    .bracket {
      position: fixed;
      width: 28px;
      height: 28px;
      z-index: 10;
      opacity: 0.4;
    }
    .bracket--tl { top: 20px; left: 20px; border-top: 1px solid var(--white); border-left: 1px solid var(--white); }
    .bracket--tr { top: 20px; right: 20px; border-top: 1px solid var(--white); border-right: 1px solid var(--white); }
    .bracket--bl { bottom: 20px; left: 20px; border-bottom: 1px solid var(--white); border-left: 1px solid var(--white); }
    .bracket--br { bottom: 20px; right: 20px; border-bottom: 1px solid var(--white); border-right: 1px solid var(--white); }

    .coord {
      position: fixed;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--faint);
      z-index: 10;
      font-family: 'Courier Prime', monospace;
    }
    .coord--bl { bottom: 24px; left: 56px; }
    .coord--br { bottom: 24px; right: 56px; }

    .hero {
      text-align: center;
      margin-bottom: 56px;
      animation: fadeUp 1.2s ease both;
    }

    .wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(64px, 10vw, 120px);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.08em;
      color: var(--white);
      line-height: 1;
      position: relative;
      display: inline-block;
    }

    .wordmark::before,
    .wordmark::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.7;
    }
    .wordmark::before { left: -28px; border-width: 1px 0 0 1px; }
    .wordmark::after  { right: -28px; border-width: 1px 1px 0 0; }

    .tagline {
      margin-top: 16px;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .countdown-block {
      text-align: center;
      margin-bottom: 56px;
      animation: fadeUp 1.2s 0.2s ease both;
    }

    .countdown-label {
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 20px;
    }

    .countdown {
      display: flex;
      gap: 32px;
      justify-content: center;
      align-items: flex-end;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .unit-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(40px, 7vw, 72px);
      font-weight: 300;
      line-height: 1;
      color: var(--white);
      min-width: 2ch;
      text-align: center;
    }

    .unit-label {
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .sep {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 6vw, 60px);
      font-weight: 300;
      color: var(--faint);
      padding-bottom: 8px;
      line-height: 1;
    }

    .launch-date {
      margin-top: 20px;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--faint);
    }

    .divider {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, transparent, var(--faint), transparent);
      margin: 0 auto 40px;
    }

    .email-block {
      width: 100%;
      max-width: 420px;
      margin-bottom: 20px;
      animation: fadeUp 1.2s 0.4s ease both;
    }

    .email-label {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 12px;
      text-align: center;
    }

    .email-row {
      display: flex;
      border: 1px solid rgba(232, 228, 220, 0.18);
      background: rgba(10, 10, 8, 0.6);
      backdrop-filter: blur(8px);
    }

    .email-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 14px 16px;
      font-family: 'Courier Prime', monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--white);
    }

    .email-row input::placeholder { color: var(--faint); }

    .email-row button {
      background: transparent;
      border: none;
      border-left: 1px solid rgba(232, 228, 220, 0.18);
      padding: 14px 20px;
      font-family: 'Courier Prime', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .email-row button:hover {
      background: rgba(200, 184, 154, 0.08);
      color: var(--white);
    }

    .email-confirm {
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--accent);
      margin-top: 10px;
      height: 16px;
      transition: opacity 0.3s;
      opacity: 0;
    }
    .email-confirm.show { opacity: 1; }

    .download-block {
      width: 100%;
      max-width: 420px;
      animation: fadeUp 1.2s 0.6s ease both;
      margin-top: 8px;
    }

    .download-label {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 12px;
      text-align: center;
    }

    .download-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: 1px solid rgba(232, 228, 220, 0.18);
      background: rgba(10, 10, 8, 0.6);
      backdrop-filter: blur(8px);
      padding: 14px 20px;
      cursor: pointer;
      text-decoration: none;
      color: var(--white);
      transition: border-color 0.25s, background 0.25s;
      position: relative;
      overflow: hidden;
    }

    .download-btn:hover {
      border-color: rgba(232, 228, 220, 0.35);
      background: rgba(200, 184, 154, 0.06);
    }

    .download-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(200,184,154,0.04) 50%, transparent 100%);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }
    .download-btn:hover::after { transform: translateX(100%); }

    .dl-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .dl-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 0.1em;
    }

    .dl-meta {
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--faint);
      text-transform: uppercase;
    }

    .dl-arrow {
      font-size: 18px;
      color: var(--accent);
      opacity: 0.7;
    }

    .soon-badge {
      display: inline-block;
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--faint);
      border: 1px solid var(--faint);
      padding: 2px 8px;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .ver {
      position: fixed;
      bottom: 24px;
      right: 56px;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--faint);
    }
  </style>
</head>
<body>

<div class="bg"></div>
<div class="grain"></div>

<div class="bracket bracket--tl"></div>
<div class="bracket bracket--tr"></div>
<div class="bracket bracket--bl"></div>
<div class="bracket bracket--br"></div>

<span class="coord coord--bl">25.7617° N 80.1918° W</span>
<span class="ver">AGRIPPA V0.001</span>

<main>

  <div class="hero">
    <div class="wordmark">AGRIPPA</div>
    <p class="tagline">Identity Operating System</p>
  </div>

  <div class="countdown-block">
    <p class="countdown-label">Launch in</p>
    <div class="countdown">
      <div class="unit">
        <span class="unit-value" id="days">00</span>
        <span class="unit-label">Days</span>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <span class="unit-value" id="hours">00</span>
        <span class="unit-label">Hours</span>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <span class="unit-value" id="minutes">00</span>
        <span class="unit-label">Min</span>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <span class="unit-value" id="seconds">00</span>
        <span class="unit-label">Sec</span>
      </div>
    </div>
    <p class="launch-date">March 2, 2026 — 3:00 PM EST</p>
  </div>

  <div class="divider"></div>

  <div class="email-block">
    <p class="email-label">Get notified at launch</p>
    <div class="email-row">
      <input type="email" id="emailInput" placeholder="your@email.com" />
      <button onclick="submitEmail()">Notify me</button>
    </div>
    <p class="email-confirm" id="emailConfirm">— Logged. You'll hear from us. —</p>
  </div>

  <div class="download-block">
    <p class="download-label">Desktop Application — macOS</p>
    <a href="#" class="download-btn" onclick="return false;">
      <div class="dl-left">
        <span class="dl-name">AGRIPPA.dmg <span class="soon-badge">Soon</span></span>
        <span class="dl-meta">macOS 12+ · Apple Silicon & Intel</span>
      </div>
      <span class="dl-arrow">↓</span>
    </a>
  </div>

</main>

<script>
  const target = new Date('2026-03-02T15:00:00-05:00');

  function tick() {
    const now = new Date();
    const diff = target - now;
    if (diff <= 0) {
      ['days','hours','minutes','seconds'].forEach(id => document.getElementById(id).textContent = '00');
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('days').textContent    = String(d).padStart(2,'0');
    document.getElementById('hours').textContent   = String(h).padStart(2,'0');
    document.getElementById('minutes').textContent = String(m).padStart(2,'0');
    document.getElementById('seconds').textContent = String(s).padStart(2,'0');
  }

  tick();
  setInterval(tick, 1000);

  function submitEmail() {
    const input = document.getElementById('emailInput');
    const confirm = document.getElementById('emailConfirm');
    const val = input.value.trim();
    if (!val || !val.includes('@')) return;
    const list = JSON.parse(localStorage.getItem('agrippa_emails') || '[]');
    list.push({ email: val, ts: new Date().toISOString() });
    localStorage.setItem('agrippa_emails', JSON.stringify(list));
    input.value = '';
    confirm.classList.add('show');
    setTimeout(() => confirm.classList.remove('show'), 4000);
  }

  document.getElementById('emailInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitEmail();
  });
</script>

</body>
</html>
